name: Veille offres quant

on:
  schedule:
    - cron: "0 7 * * 1-5"   # 7h UTC, du lundi au vendredi
  workflow_dispatch:         # bouton "Run workflow" pour tester a la main

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll les job boards
        id: poll
        run: python watch.py

      - name: Ouvrir une issue si nouvelles offres
        if: steps.poll.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.poll.outputs.count }} nouvelle(s) offre(s) â€” $(date +%d/%m)" \
            --body-file new_jobs.md
            --assignee romain-lamauve

      - name: Sauvegarder l'etat
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "maj seen.json"
          git push
